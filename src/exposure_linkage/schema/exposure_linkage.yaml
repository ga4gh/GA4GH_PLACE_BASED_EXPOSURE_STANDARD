---
id: https://w3id.org/ga4gh/exposure-linkage   # placeholder - register a w3id before release
name: exposure_linkage
title: GA4GH Environmental Exposure Linkage Metadata
description: >-
  Describes how an environmental exposure dataset was linked to cohort
  participants. One ExposureLinkageRecord = one exposure variable linked
  in one cohort. Converted from "Implementation 1 - GA4GH Metadata Schema".
version: 0.1.0
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  expo: https://w3id.org/ga4gh/exposure-linkage/
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  ExO: http://purl.obolibrary.org/obo/ExO_
  MESH: http://id.nlm.nih.gov/mesh/
  PUBCHEM: http://rdf.ncbi.nlm.nih.gov/pubchem/compound/CID
  INCHIKEY: "https://identifiers.org/inchikey:"
  CAS: "https://identifiers.org/cas:"
  DTXSID: https://comptox.epa.gov/dashboard/chemical/details/
  ORCID: https://orcid.org/
default_prefix: expo
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------- types
types:
  RegionCode:
    typeof: string
    base: str
    uri: xsd:string
    title: Region code
    description: ISO 3166-1 alpha-2 country code, or ISO 3166-2 subdivision code (e.g. US-NC).
    pattern: "^(AD|AE|AF|AG|AI|AL|AM|AO|AQ|AR|AS|AT|AU|AW|AX|AZ|BA|BB|BD|BE|BF|BG|BH|BI|BJ|BL|BM|BN|BO|BQ|BR|BS|BT|BV|BW|BY|BZ|CA|CC|CD|CF|CG|CH|CI|CK|CL|CM|CN|CO|CR|CU|CV|CW|CX|CY|CZ|DE|DJ|DK|DM|DO|DZ|EC|EE|EG|EH|ER|ES|ET|FI|FJ|FK|FM|FO|FR|GA|GB|GD|GE|GF|GG|GH|GI|GL|GM|GN|GP|GQ|GR|GS|GT|GU|GW|GY|HK|HM|HN|HR|HT|HU|ID|IE|IL|IM|IN|IO|IQ|IR|IS|IT|JE|JM|JO|JP|KE|KG|KH|KI|KM|KN|KP|KR|KW|KY|KZ|LA|LB|LC|LI|LK|LR|LS|LT|LU|LV|LY|MA|MC|MD|ME|MF|MG|MH|MK|ML|MM|MN|MO|MP|MQ|MR|MS|MT|MU|MV|MW|MX|MY|MZ|NA|NC|NE|NF|NG|NI|NL|NO|NP|NR|NU|NZ|OM|PA|PE|PF|PG|PH|PK|PL|PM|PN|PR|PS|PT|PW|PY|QA|RE|RO|RS|RU|RW|SA|SB|SC|SD|SE|SG|SH|SI|SJ|SK|SL|SM|SN|SO|SR|SS|ST|SV|SX|SY|SZ|TC|TD|TF|TG|TH|TJ|TK|TL|TM|TN|TO|TR|TT|TV|TW|TZ|UA|UG|UM|US|UY|UZ|VA|VC|VE|VG|VI|VN|VU|WF|WS|YE|YT|ZA|ZM|ZW)(-[A-Z0-9]{1,3})?$"
  PartialDate:
    typeof: string
    base: str
    uri: xsd:string
    title: Partial date
    description: ISO 8601 calendar date at year, month or day precision (YYYY, YYYY-MM or YYYY-MM-DD).
    pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
  CURIE:
    typeof: uriorcurie
    base: URIorCURIE
    uri: xsd:anyURI
    title: CURIE
    description: Compact identifier using a prefix declared in this schema, e.g. INCHIKEY:..., ENVO:..., MESH:...
  UcumCode:
    typeof: string
    base: str
    uri: xsd:string
    title: UCUM code
    description: >-
      UCUM case-sensitive code, e.g. ug/m3, ng/m3, [ppb], [ppm], Cel, mm,
      m/s, W/m2, /km2, %, 1 (dimensionless index). dB(A) has no UCUM code -
      use "dB" and record the weighting in the exposure variable name.

# ---------------------------------------------------------------- classes
classes:
  ExposureLinkageCollection:
    tree_root: true
    title: Exposure linkage collection
    description: Container so that one file can hold many exposure linkage records.
    attributes:
      records:
        title: Records
        description: The exposure linkage records in this file.
        range: ExposureLinkageRecord
        multivalued: true
        inlined_as_list: true
        required: true

  ExposureLinkageRecord:
    title: Exposure linkage record
    description: One exposure variable linked to the participants of one cohort.
    attributes:
      id:
        identifier: true
        title: Record identifier
        description: Stable record identifier, e.g. UKB-NO2-ELAPSE-2010.
      cohort:
        title: Cohort
        description: The cohort or study whose participants received the exposure values.
        range: Cohort
        required: true
        inlined: true
      exposure:
        title: Exposure
        description: The exposure variable that was linked.
        range: ExposureVariable
        required: true
        inlined: true
      source_data:
        title: Source data
        description: The upstream exposure product the values were taken from.
        range: SourceDataset
        required: true
        inlined: true
      linkage:
        title: Linkage
        description: How exposure values were assigned to participants.
        range: Linkage
        required: true
        inlined: true
      creators:
        title: Creator(s)
        description: People responsible for producing this linkage.
        range: Person
        multivalued: true
        inlined_as_list: true
        recommended: true

  Cohort:
    title: Cohort
    description: >-
      The cohort or study whose participants were linked. Replaces the CSV
      fields "Cohort / Study Name" and "Country of Participant Data Collection".
    attributes:
      name:
        title: Cohort / Study Name
        description: Full name of the cohort or study, e.g. UK Biobank.
        required: true
      acronym:
        title: Cohort acronym
        description: Short name, e.g. UKB. Split out of the old "Name (ACRONYM)" string.
        required: true
      collection_countries:
        title: Country of Participant Data Collection
        description: Countries in which participant data were collected, as ISO 3166-1 alpha-2 codes.
        range: CountryCodeEnum
        multivalued: true
        required: true

  ExposureVariable:
    title: Exposure variable
    description: >-
      The environmental exposure that was linked. Replaces the CSV fields
      "Exposure Domain", "Exposure Variable Name", "Ontology / Taxonomy Term ID"
      and "Unit of Measure".
    attributes:
      domain:
        title: Exposure Domain
        description: Broad exposure domain.
        range: ExposureDomainEnum
        required: true
      domain_other:
        title: Exposure Domain (other)
        description: Free-text domain. Required when domain = OTHER.
      name:
        title: Exposure Variable Name
        description: Descriptive term for the variable, e.g. NO2, PM2.5, Lden, NDVI.
        required: true
      ontology_terms:
        title: Ontology / Taxonomy Term ID
        description: >-
          Resolvable identifiers for the exposure. Chemicals: INCHIKEY
          (preferred), PUBCHEM, DTXSID, CAS. Physical or environmental
          exposures: ExO, ENVO, MESH. Leave empty if no term exists.
        range: CURIE
        multivalued: true
        recommended: true
      unit:
        title: Unit of Measure
        description: UCUM code for the unit of the linked values. Omit for categorical variables.
        range: UcumCode
      is_categorical:
        title: Is categorical
        description: True if the variable takes categorical rather than numeric values.
        range: boolean
    rules:
      - description: OTHER domain must be specified.
        preconditions:
          slot_conditions:
            domain:
              equals_string: OTHER
        postconditions:
          slot_conditions:
            domain_other:
              required: true

  SourceDataset:
    title: Source dataset
    description: The upstream exposure product (model, satellite product, monitoring network, ...).
    attributes:
      origin:
        title: Origin of the Data
        description: How the source exposure data were produced.
        range: DataOriginEnum
        required: true
      dataset_name:
        title: Model / Dataset Name
        description: Name of the model or dataset, e.g. ELAPSE LUR, ERA5, MODIS MOD13A3.
        required: true
      dataset_version:
        title: Model / Dataset Version
        description: Version number or release year, e.g. 2.0, 006, 2023.
        required: true
      citations:
        title: Data Source Citation / URL
        description: Citations for the source dataset and the methods used to produce it.
        range: Citation
        multivalued: true
        required: true
        inlined_as_list: true
      geographic_coverage:
        title: Geographic Coverage
        description: Area covered by the source dataset.
        range: GeographicCoverage
        required: true
        inlined: true
      spatial_resolution:
        title: Spatial Resolution
        description: Spatial resolution of the source dataset.
        range: SpatialResolution
        required: true
        inlined: true
      temporal_coverage:
        title: Date Coverage
        description: Period covered by the source dataset.
        range: TemporalCoverage
        required: true
        inlined: true
      temporal_resolution:
        title: Temporal Resolution
        description: Temporal resolution of the source dataset.
        range: TemporalResolutionEnum
        required: true
      update_frequency:
        title: Update frequency
        description: For PERIODIC_UPDATE, the update interval as an ISO 8601 duration, e.g. P5Y.
        pattern: "^P(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?$"
      validation_metrics:
        title: Validation Status
        description: >-
          Reported validation metrics. An empty list with
          validation_reported = false means the dataset was not validated.
        range: ValidationMetric
        multivalued: true
        inlined_as_list: true
        recommended: true
      validation_reported:
        title: Validation reported
        description: True if the dataset producers report a validation of the dataset.
        range: boolean
      uncertainty:
        title: Uncertainty
        description: Uncertainty information available for the dataset.
        range: Uncertainty
        inlined: true
        recommended: true
    rules:
      - description: Periodic update needs a frequency.
        preconditions:
          slot_conditions:
            temporal_resolution:
              equals_string: PERIODIC_UPDATE
        postconditions:
          slot_conditions:
            update_frequency:
              required: true

  Citation:
    title: Citation
    description: >-
      A reference to the source data or its documentation. At least one of
      doi, url or text is required.
    attributes:
      doi:
        title: DOI
        description: "Bare DOI, without the doi: prefix or resolver URL, e.g. 10.1234/abcd."
        pattern: "^10\\.\\d{4,9}/\\S+$"
      url:
        title: URL
        description: Web address of the source or its documentation.
        range: uri
      accessed:
        title: Accessed
        description: Date the URL was accessed. Required when url is given without a DOI.
        range: date
      text:
        title: Citation text
        description: Free-text citation, for sources without a DOI or URL.
      used_for_linkage:
        title: Used for linkage
        description: True if this is the source actually used for the linkage. Replaces the old "*" marker.
        range: boolean
    any_of:
      - slot_conditions:
          doi:
            required: true
      - slot_conditions:
          url:
            required: true
      - slot_conditions:
          text:
            required: true

  GeographicCoverage:
    title: Geographic coverage
    description: Area covered by a source dataset.
    attributes:
      scope:
        title: Scope
        description: Kind of coverage.
        range: GeographicScopeEnum
        required: true
      regions:
        title: Regions
        description: ISO 3166-1 / ISO 3166-2 codes. Required when scope = COUNTRIES_OR_REGIONS.
        range: RegionCode
        multivalued: true
      description:
        title: Coverage description
        description: Optional note, e.g. "UK-wide", "multiple provinces".
    rules:
      - description: Country/region scope needs region codes.
        preconditions:
          slot_conditions:
            scope:
              equals_string: COUNTRIES_OR_REGIONS
        postconditions:
          slot_conditions:
            regions:
              required: true

  SpatialResolution:
    title: Spatial resolution
    description: >-
      Spatial resolution of a source dataset, as numbers rather than strings
      such as "100 m x 100 m".
    attributes:
      type:
        title: Resolution type
        description: Kind of spatial support.
        range: SpatialResolutionTypeEnum
        required: true
      cell_width:
        title: Cell width
        description: Grid cell width; metres for GRID_METRIC, degrees for GRID_DEGREE.
        range: float
      cell_height:
        title: Cell height
        description: Grid cell height; metres for GRID_METRIC, degrees for GRID_DEGREE.
        range: float
      admin_unit_name:
        title: Administrative unit name
        description: For ADMINISTRATIVE_UNIT, the unit type, e.g. LSOA, census tract.
      admin_unit_approx_population:
        title: Administrative unit approximate population
        description: Typical population of one administrative unit.
        range: integer
    rules:
      - description: Metric grid needs cell size.
        preconditions:
          slot_conditions:
            type:
              equals_string: GRID_METRIC
        postconditions:
          slot_conditions:
            cell_width:
              required: true
            cell_height:
              required: true
      - description: Degree grid needs cell size.
        preconditions:
          slot_conditions:
            type:
              equals_string: GRID_DEGREE
        postconditions:
          slot_conditions:
            cell_width:
              required: true
            cell_height:
              required: true
      - description: Admin unit needs a unit name.
        preconditions:
          slot_conditions:
            type:
              equals_string: ADMINISTRATIVE_UNIT
        postconditions:
          slot_conditions:
            admin_unit_name:
              required: true

  TemporalCoverage:
    title: Temporal coverage
    description: Period covered by a source dataset.
    attributes:
      start:
        title: Date Coverage - Start
        description: First date covered, as an ISO 8601 partial date.
        range: PartialDate
        required: true
      end:
        title: Date Coverage - End
        description: Last date covered, as an ISO 8601 partial date. Omit when ongoing = true.
        range: PartialDate
      ongoing:
        title: Ongoing
        description: True if the dataset is still being extended. Replaces the magic string "Ongoing".
        range: boolean
      last_updated:
        title: Last updated
        description: Date of the most recent update. Required when ongoing = true.
        range: PartialDate
    rules:
      # Not enforced by the generated JSON Schema: gen-json-schema emits
      # `const: "true"` (a string) for this boolean slot. See
      # tests/data/problem/invalid/.
      - description: Ongoing datasets need a last-updated date.
        preconditions:
          slot_conditions:
            ongoing:
              equals_string: "true"
        postconditions:
          slot_conditions:
            last_updated:
              required: true

  ValidationMetric:
    title: Validation metric
    description: One reported validation metric of a source dataset.
    attributes:
      metric:
        title: Metric
        description: The validation statistic.
        range: ValidationMetricEnum
        required: true
      validation_design:
        title: Validation design
        description: How the validation was carried out.
        range: ValidationDesignEnum
      value:
        title: Value
        description: Value of the statistic.
        range: float
        required: true
      unit:
        title: Unit
        description: UCUM code, for RMSE and mean bias. Omit for R2, r and percentages.
        range: UcumCode

  Uncertainty:
    title: Uncertainty
    description: Uncertainty information for a source dataset.
    attributes:
      type:
        title: Uncertainty type
        description: Form in which uncertainty is available.
        range: UncertaintyTypeEnum
        required: true
      value:
        title: Value
        description: Point value of the uncertainty measure, if a single value applies.
        range: float
      lower:
        title: Lower bound
        description: Lower bound of the uncertainty interval.
        range: float
      upper:
        title: Upper bound
        description: Upper bound of the uncertainty interval.
        range: float
      unit:
        title: Unit
        description: UCUM code for value, lower and upper.
        range: UcumCode
      carried_to_participant_level:
        title: Carried to participant level
        description: True if uncertainty is propagated to the participant-level exposure values.
        range: boolean

  Linkage:
    title: Linkage
    description: How exposure values were assigned to participants.
    attributes:
      spatial_linkage_unit:
        title: Spatial Linkage Unit
        description: Participant location used for the linkage.
        range: SpatialLinkageUnitEnum
        required: true
      centroid_weighting:
        title: Centroid weighting
        description: How the centroid was computed. Required for any *_CENTROID unit.
        range: CentroidWeightingEnum
      centroid_areal_unit:
        title: Centroid areal unit
        description: The areal unit the centroid represents, e.g. "output area".
      population_dataset:
        title: Population dataset
        description: Population dataset used for POPULATION_WEIGHTED centroids.
      operation:
        title: Spatial Linkage Operation
        description: GIS operation used to assign values.
        range: LinkageOperationEnum
        required: true
      buffer_radii_m:
        title: Buffer Distance
        description: Buffer radii in metres. Required for CIRCULAR_BUFFER; list all radii if several were reported.
        range: float
        multivalued: true
        minimum_value: 0
      network_mode:
        title: Network mode
        description: Travel mode for NETWORK_BUFFER.
        range: NetworkModeEnum
      network_distance_m:
        title: Network distance (m)
        description: Network buffer distance in metres.
        range: float
      network_time_min:
        title: Network time (min)
        description: Network buffer travel time in minutes.
        range: float
      intersection_min_overlap_pct:
        title: Intersection minimum overlap (%)
        description: Minimum areal overlap, in percent, for INTERSECTION.
        range: float
        minimum_value: 0
        maximum_value: 100
      kernel_bandwidth_m:
        title: Kernel bandwidth (m)
        description: Kernel bandwidth in metres. Required for KERNEL_DENSITY_WEIGHTED.
        range: float
      kernel_grid_resolution_m:
        title: Kernel grid resolution (m)
        description: Output grid resolution of the kernel density surface, in metres.
        range: float
      geocoding_precision:
        title: Geocoding Precision
        description: Precision of participant geocodes.
        range: GeocodingPrecisionEnum
        recommended: true
      geocoding_mixed_breakdown:
        title: Geocoding mixed breakdown
        description: For MIXED precision, the share of each level, e.g. "80% building, 20% postcode".
      geocoder:
        title: Geocoding Database Version
        description: Geocoding database name and version or release date.
        recommended: true
      aggregation:
        title: Summary Statistic / Aggregation
        description: >-
          Summary statistic applied to the exposure values. Buffer geometry is
          recorded once, under operation.
        range: AggregationEnum
        required: true
      aggregation_n:
        title: Aggregation N
        description: N for MULTI_YEAR_MEAN (years) or PERCENTILE (the percentile).
        range: integer
      participant_coverage_pct:
        title: Missing Data / Coverage
        description: Percentage (0-100) of coverage units that received an exposure value.
        range: float
        minimum_value: 0
        maximum_value: 100
        recommended: true
      coverage_unit:
        title: Coverage unit
        description: Unit that participant_coverage_pct counts.
        range: CoverageUnitEnum
      study_area_coverage_pct:
        title: Study area coverage (%)
        description: Percentage (0-100) of the study area covered by the source dataset.
        range: float
        minimum_value: 0
        maximum_value: 100
      exposure_window:
        title: Exposure Window
        description: Period of exposure the linked values represent.
        range: ExposureWindowEnum
        recommended: true
      exposure_window_years:
        title: Exposure window (years)
        description: Length of the exposure window in years, e.g. N for N_YEARS_BEFORE_INDEX.
        range: integer
      exposure_window_detail:
        title: Exposure window detail
        description: Further detail, e.g. trimester or age range.
      residential_history:
        title: Residential History
        description: Extent to which residential moves were accounted for.
        range: ResidentialHistoryEnum
        recommended: true
      residential_history_detail:
        title: Residential history detail
        description: Free-text detail on how residential history was handled.
      linkage_date:
        title: Linkage Date
        description: Date the linkage was performed.
        range: date
        recommended: true
      relinkages:
        title: Relinkages
        description: Later re-runs of the linkage, e.g. after a geocoder update.
        range: Relinkage
        multivalued: true
        inlined_as_list: true
    rules:
      - description: Circular buffer needs a radius.
        preconditions:
          slot_conditions:
            operation:
              equals_string: CIRCULAR_BUFFER
        postconditions:
          slot_conditions:
            buffer_radii_m:
              required: true
      - description: Network buffer needs a mode.
        preconditions:
          slot_conditions:
            operation:
              equals_string: NETWORK_BUFFER
        postconditions:
          slot_conditions:
            network_mode:
              required: true
      - description: Kernel density needs bandwidth.
        preconditions:
          slot_conditions:
            operation:
              equals_string: KERNEL_DENSITY_WEIGHTED
        postconditions:
          slot_conditions:
            kernel_bandwidth_m:
              required: true
      - description: Multi-year mean needs N.
        preconditions:
          slot_conditions:
            aggregation:
              equals_string: MULTI_YEAR_MEAN
        postconditions:
          slot_conditions:
            aggregation_n:
              required: true
      - description: Percentile needs N.
        preconditions:
          slot_conditions:
            aggregation:
              equals_string: PERCENTILE
        postconditions:
          slot_conditions:
            aggregation_n:
              required: true
      - description: POSTCODE_CENTROID needs centroid weighting.
        preconditions:
          slot_conditions:
            spatial_linkage_unit:
              equals_string: POSTCODE_CENTROID
        postconditions:
          slot_conditions:
            centroid_weighting:
              required: true
      - description: CENSUS_TRACT_CENTROID needs centroid weighting.
        preconditions:
          slot_conditions:
            spatial_linkage_unit:
              equals_string: CENSUS_TRACT_CENTROID
        postconditions:
          slot_conditions:
            centroid_weighting:
              required: true
      - description: LSOA_CENTROID needs centroid weighting.
        preconditions:
          slot_conditions:
            spatial_linkage_unit:
              equals_string: LSOA_CENTROID
        postconditions:
          slot_conditions:
            centroid_weighting:
              required: true
      - description: MUNICIPALITY_CENTROID needs centroid weighting.
        preconditions:
          slot_conditions:
            spatial_linkage_unit:
              equals_string: MUNICIPALITY_CENTROID
        postconditions:
          slot_conditions:
            centroid_weighting:
              required: true
      - description: OTHER_AREAL_CENTROID needs centroid weighting.
        preconditions:
          slot_conditions:
            spatial_linkage_unit:
              equals_string: OTHER_AREAL_CENTROID
        postconditions:
          slot_conditions:
            centroid_weighting:
              required: true
      - description: Population weighting needs the population dataset.
        preconditions:
          slot_conditions:
            centroid_weighting:
              equals_string: POPULATION_WEIGHTED
        postconditions:
          slot_conditions:
            population_dataset:
              required: true
      - description: Mixed geocoding needs a breakdown.
        preconditions:
          slot_conditions:
            geocoding_precision:
              equals_string: MIXED
        postconditions:
          slot_conditions:
            geocoding_mixed_breakdown:
              required: true

  Relinkage:
    title: Relinkage
    description: A later re-run of a linkage.
    attributes:
      date:
        title: Relinkage date
        description: Date of the re-run.
        range: date
        required: true
      reason:
        title: Reason
        description: Why the linkage was re-run, e.g. geocoder update.
        required: true

  Person:
    title: Person
    description: A creator of the linkage. Replaces the CSV field "Creator(s)".
    attributes:
      name:
        title: Name
        description: Full name of the person.
      email:
        title: Email
        description: Contact email address.
        pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      orcid:
        title: ORCID
        description: ORCID identifier as a CURIE, e.g. ORCID:0000-0002-1825-0097.
        range: CURIE
      role:
        title: Role
        description: Role in producing the linkage, e.g. senior investigator.

