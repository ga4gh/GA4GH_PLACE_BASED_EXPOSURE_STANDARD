  ExposureDomainEnum:
    title: Exposure domain
    description: Broad domain of an environmental exposure.
    permissible_values:
      AIR_POLLUTION:
      CLIMATE_WEATHER:
      GREEN_SPACE:
      BLUE_SPACE:
      NOISE:
      SOCIODEMOGRAPHIC:
      BUILT_ENVIRONMENT:
      WATER_QUALITY:
      LIGHT_POLLUTION:
      BIODIVERSITY:
      INDOOR_HOME_ENVIRONMENT:
      OTHER:
        description: Any other domain; give it in domain_other.
  DataOriginEnum:
    title: Data origin
    description: How the source exposure data were produced.
    permissible_values:
      MONITORING_STATION:
      LAND_USE_REGRESSION:
      CHEMICAL_TRANSPORT_MODEL:
      SATELLITE_DERIVED:
      PERSONAL_MONITOR:
      QUESTIONNAIRE:
      ADMINISTRATIVE_RECORD:
      REANALYSIS:
        description: Reanalysis products such as ERA5. Added because they were otherwise unclassifiable.
      OTHER:
  GeographicScopeEnum:
    title: Geographic scope
    description: Kind of geographic coverage.
    permissible_values:
      COUNTRIES_OR_REGIONS:
        description: Listed countries or subdivisions; give them in regions.
      EU27:
        description: The 27 EU member states.
      GLOBAL:
        description: Worldwide coverage.
  SpatialResolutionTypeEnum:
    title: Spatial resolution type
    description: Kind of spatial support of a source dataset.
    permissible_values:
      GRID_METRIC:
        description: Regular grid with cell size in metres.
      GRID_DEGREE:
        description: Regular grid with cell size in degrees.
      ADMINISTRATIVE_UNIT:
        description: Values per administrative area.
      POINT_ADDRESS:
        description: Values at address points.
      POINT_GPS:
        description: Values at GPS points.
  TemporalResolutionEnum:
    title: Temporal resolution
    description: Temporal resolution of a source dataset.
    permissible_values:
      SUB_HOURLY:
      HOURLY:
      DAILY:
      WEEKLY:
      MONTHLY:
      SEASONAL:
      ANNUAL:
      MULTI_YEAR_AVERAGE:
      EVENT_BASED:
      STATIC:
      PERIODIC_UPDATE:
        description: Static snapshots refreshed at an interval; give it in update_frequency.
  ValidationMetricEnum:
    title: Validation metric
    description: Validation statistic.
    permissible_values:
      R2:
        description: Coefficient of determination.
      RMSE:
        description: Root mean squared error.
      NRMSE_PCT:
        description: Normalised root mean squared error, in percent.
      MEAN_BIAS:
        description: Mean bias.
      RELATIVE_BIAS_PCT:
        description: Relative bias, in percent.
      PEARSON_R:
        description: Pearson correlation coefficient.
  ValidationDesignEnum:
    title: Validation design
    description: How a validation was carried out.
    permissible_values:
      LOOCV_SPATIAL:
        description: Leave-one-out cross-validation over sites.
      INDEPENDENT_TEST_SET_SPATIAL:
        description: Validation against held-out sites.
      TEMPORAL:
        description: Validation against held-out time periods.
      OVERALL:
        description: Validation reported without a stated design.
      GROUND_MONITOR_COMPARISON:
        description: Comparison against ground monitors.
  UncertaintyTypeEnum:
    title: Uncertainty type
    description: Form in which uncertainty is available.
    permissible_values:
      NOT_AVAILABLE:
      SD_PER_UNIT:
        description: Standard deviation per spatial unit.
      PREDICTION_INTERVAL_95:
        description: 95% prediction interval.
      FULL_PREDICTIVE_DISTRIBUTION:
      MODEL_LEVEL_RMSE_ONLY:
        description: Only a model-level RMSE is available.
  SpatialLinkageUnitEnum:
    title: Spatial linkage unit
    description: Participant location used for the linkage.
    permissible_values:
      GEOCODED_ADDRESS:
      GPS_COORDINATE:
      POSTCODE_CENTROID:
      CENSUS_TRACT_CENTROID:
      LSOA_CENTROID:
        description: Centroid of a Lower Layer Super Output Area (England and Wales).
      MUNICIPALITY_CENTROID:
      OTHER_AREAL_CENTROID:
      GRID_CELL_CONTAINING_ADDRESS:
  CentroidWeightingEnum:
    title: Centroid weighting
    description: How an areal centroid was computed.
    permissible_values:
      GEOMETRIC:
      POPULATION_WEIGHTED:
        description: Population-weighted centroid; give the population dataset.
      AREA_WEIGHTED:
  LinkageOperationEnum:
    title: Linkage operation
    description: GIS operation used to assign exposure values to locations.
    permissible_values:
      POINT_IN_POLYGON:
      CIRCULAR_BUFFER:
        description: Euclidean buffer; give the radii in buffer_radii_m.
      NETWORK_BUFFER:
        description: Street-network buffer; give network_mode.
      NEAREST_FEATURE:
      AREAL_INTERPOLATION:
      INTERSECTION:
      KERNEL_DENSITY_WEIGHTED:
        description: Kernel-weighted surface; give kernel_bandwidth_m.
      ADMINISTRATIVE_ASSIGNMENT:
  NetworkModeEnum:
    title: Network mode
    description: Travel mode for a network buffer.
    permissible_values:
      WALKING:
      CYCLING:
      DRIVING:
      PUBLIC_TRANSPORT:
  GeocodingPrecisionEnum:
    title: Geocoding precision
    description: Precision of participant geocodes.
    permissible_values:
      BUILDING:
        description: "< 5 m"
      PARCEL:
        description: "< 10 m"
      STREET:
        description: "< 50 m"
      POSTCODE_CENTROID:
        description: "< 500 m"
      CENSUS_UNIT_CENTROID:
        description: "> 500 m"
      MIXED:
        description: Several levels; give the shares in geocoding_mixed_breakdown.
      UNKNOWN:
  AggregationEnum:
    title: Aggregation
    description: Summary statistic applied to exposure values.
    permissible_values:
      ANNUAL_MEAN:
      MONTHLY_MEAN:
      DAILY_MEAN:
      DAILY_MAX:
      DAILY_MIN:
      EIGHT_HOUR_MEAN:
      WARM_SEASON_MEAN:
      COLD_SEASON_MEAN:
      NIGHT_TIME_MEAN:
      MULTI_YEAR_MEAN:
        description: Mean over N years; give N in aggregation_n.
      CUMULATIVE_SUM:
      PERCENTILE:
        description: The Nth percentile; give N in aggregation_n.
      PRESENCE_ABSENCE:
      DISTANCE_TO_NEAREST:
      COUNT_WITHIN_BUFFER:
      MEAN_WITHIN_BUFFER:
        description: Buffer geometry lives in linkage.operation - not duplicated here.
      COMPOSITE_INDEX:
      RAW_TIME_SERIES:
  CoverageUnitEnum:
    title: Coverage unit
    description: Unit that a coverage percentage counts.
    permissible_values:
      PARTICIPANTS:
      HOUSEHOLDS:
      CLINICAL_SITES:
      HOSPITALS:
      GEOGRAPHIC_UNITS:
  ExposureWindowEnum:
    title: Exposure window
    description: Period of exposure that linked values represent.
    permissible_values:
      YEAR_BEFORE_RECRUITMENT:
      N_YEARS_BEFORE_INDEX:
        description: N years before an index date; give N in exposure_window_years.
      PRENATAL:
      PERICONCEPTION:
      INFANCY:
      EARLY_CHILDHOOD:
      ADOLESCENCE:
      LIFETIME_CUMULATIVE:
      TIME_VARYING_ANNUAL:
      CRITICAL_WINDOW:
  ResidentialHistoryEnum:
    title: Residential history
    description: Extent to which residential moves were accounted for.
    permissible_values:
      BASELINE_ONLY:
      FULL_HISTORY:
      PARTIAL_HISTORY:
      NOT_APPLICABLE:
      UNKNOWN:
