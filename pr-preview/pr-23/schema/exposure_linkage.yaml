classes:
  ExposureLinkageCollection:
    name: ExposureLinkageCollection
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureLinkageCollection
    description: Container so that one file can hold many exposure linkage records.
    title: Exposure linkage collection
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureLinkageCollection__records
    attributes:
      records:
        name: records
        description: The exposure linkage records in this file.
        title: Records
        range: ExposureLinkageRecord
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: expo:ExposureLinkageCollection
    tree_root: true
  ExposureLinkageRecord:
    name: ExposureLinkageRecord
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureLinkageRecord
    description: One exposure variable linked to the participants of one cohort.
    title: Exposure linkage record
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureLinkageRecord__id
    - exposureLinkageRecord__cohort
    - exposureLinkageRecord__exposure
    - exposureLinkageRecord__source_data
    - exposureLinkageRecord__linkage
    - exposureLinkageRecord__creators
    attributes:
      id:
        name: id
        description: Stable record identifier, e.g. UKB-NO2-ELAPSE-2010.
        title: Record identifier
        identifier: true
      cohort:
        name: cohort
        description: The cohort or study whose participants received the exposure
          values.
        title: Cohort
        range: Cohort
        required: true
        inlined: true
      exposure:
        name: exposure
        description: The exposure variable that was linked.
        title: Exposure
        range: ExposureVariable
        required: true
        inlined: true
      source_data:
        name: source_data
        description: The upstream exposure product the values were taken from.
        title: Source data
        range: SourceDataset
        required: true
        inlined: true
      linkage:
        name: linkage
        description: How exposure values were assigned to participants.
        title: Linkage
        range: Linkage
        required: true
        inlined: true
      creators:
        name: creators
        description: People responsible for producing this linkage.
        title: Creator(s)
        range: Person
        recommended: true
        multivalued: true
        inlined_as_list: true
    class_uri: expo:ExposureLinkageRecord
  Cohort:
    name: Cohort
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Cohort
    description: The cohort or study whose participants were linked. Replaces the
      CSV fields "Cohort / Study Name" and "Country of Participant Data Collection".
    title: Cohort
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - cohort__name
    - cohort__acronym
    - cohort__collection_countries
    attributes:
      name:
        name: name
        description: Full name of the cohort or study, e.g. UK Biobank.
        title: Cohort / Study Name
        required: true
      acronym:
        name: acronym
        description: Short name, e.g. UKB. Split out of the old "Name (ACRONYM)" string.
        title: Cohort acronym
        required: true
      collection_countries:
        name: collection_countries
        description: Countries in which participant data were collected, as ISO 3166-1
          alpha-2 codes.
        title: Country of Participant Data Collection
        range: CountryCodeEnum
        required: true
        multivalued: true
    class_uri: expo:Cohort
  ExposureVariable:
    name: ExposureVariable
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureVariable
    description: The environmental exposure that was linked. Replaces the CSV fields
      "Exposure Domain", "Exposure Variable Name", "Ontology / Taxonomy Term ID" and
      "Unit of Measure".
    title: Exposure variable
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureVariable__domain
    - exposureVariable__domain_other
    - exposureVariable__name
    - exposureVariable__ontology_terms
    - exposureVariable__unit
    - exposureVariable__is_categorical
    attributes:
      domain:
        name: domain
        description: Broad exposure domain.
        title: Exposure Domain
        range: ExposureDomainEnum
        required: true
      domain_other:
        name: domain_other
        description: Free-text domain. Required when domain = OTHER.
        title: Exposure Domain (other)
      name:
        name: name
        description: Descriptive term for the variable, e.g. NO2, PM2.5, Lden, NDVI.
        title: Exposure Variable Name
        required: true
      ontology_terms:
        name: ontology_terms
        description: 'Resolvable identifiers for the exposure. Chemicals: INCHIKEY
          (preferred), PUBCHEM, DTXSID, CAS. Physical or environmental exposures:
          ExO, ENVO, MESH. Leave empty if no term exists.'
        title: Ontology / Taxonomy Term ID
        range: CURIE
        recommended: true
        multivalued: true
      unit:
        name: unit
        description: UCUM code for the unit of the linked values. Omit for categorical
          variables.
        title: Unit of Measure
        range: UcumCode
      is_categorical:
        name: is_categorical
        description: True if the variable takes categorical rather than numeric values.
        title: Is categorical
        range: boolean
    class_uri: expo:ExposureVariable
    rules:
    - preconditions:
        slot_conditions:
          domain:
            name: domain
            equals_string: OTHER
      postconditions:
        slot_conditions:
          domain_other:
            name: domain_other
            required: true
      description: OTHER domain must be specified.
  SourceDataset:
    name: SourceDataset
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/SourceDataset
    description: The upstream exposure product (model, satellite product, monitoring
      network, ...).
    title: Source dataset
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - sourceDataset__origin
    - sourceDataset__dataset_name
    - sourceDataset__dataset_version
    - sourceDataset__citations
    - sourceDataset__geographic_coverage
    - sourceDataset__spatial_resolution
    - sourceDataset__temporal_coverage
    - sourceDataset__temporal_resolution
    - sourceDataset__update_frequency
    - sourceDataset__validation_metrics
    - sourceDataset__validation_reported
    - sourceDataset__uncertainty
    attributes:
      origin:
        name: origin
        description: How the source exposure data were produced.
        title: Origin of the Data
        range: DataOriginEnum
        required: true
      dataset_name:
        name: dataset_name
        description: Name of the model or dataset, e.g. ELAPSE LUR, ERA5, MODIS MOD13A3.
        title: Model / Dataset Name
        required: true
      dataset_version:
        name: dataset_version
        description: Version number or release year, e.g. 2.0, 006, 2023.
        title: Model / Dataset Version
        required: true
      citations:
        name: citations
        description: Citations for the source dataset and the methods used to produce
          it.
        title: Data Source Citation / URL
        range: Citation
        required: true
        multivalued: true
        inlined_as_list: true
      geographic_coverage:
        name: geographic_coverage
        description: Area covered by the source dataset.
        title: Geographic Coverage
        range: GeographicCoverage
        required: true
        inlined: true
      spatial_resolution:
        name: spatial_resolution
        description: Spatial resolution of the source dataset.
        title: Spatial Resolution
        range: SpatialResolution
        required: true
        inlined: true
      temporal_coverage:
        name: temporal_coverage
        description: Period covered by the source dataset.
        title: Date Coverage
        range: TemporalCoverage
        required: true
        inlined: true
      temporal_resolution:
        name: temporal_resolution
        description: Temporal resolution of the source dataset.
        title: Temporal Resolution
        range: TemporalResolutionEnum
        required: true
      update_frequency:
        name: update_frequency
        description: For PERIODIC_UPDATE, the update interval as an ISO 8601 duration,
          e.g. P5Y.
        title: Update frequency
        pattern: ^P(\d+Y)?(\d+M)?(\d+W)?(\d+D)?$
      validation_metrics:
        name: validation_metrics
        description: Reported validation metrics. An empty list with validation_reported
          = false means the dataset was not validated.
        title: Validation Status
        range: ValidationMetric
        recommended: true
        multivalued: true
        inlined_as_list: true
      validation_reported:
        name: validation_reported
        description: True if the dataset producers report a validation of the dataset.
        title: Validation reported
        range: boolean
      uncertainty:
        name: uncertainty
        description: Uncertainty information available for the dataset.
        title: Uncertainty
        range: Uncertainty
        recommended: true
        inlined: true
    class_uri: expo:SourceDataset
    rules:
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: PERIODIC_UPDATE
      postconditions:
        slot_conditions:
          update_frequency:
            name: update_frequency
            required: true
      description: Periodic update needs a frequency.
  Citation:
    name: Citation
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Citation
    description: A reference to the source data or its documentation. At least one
      of doi, url or text is required.
    title: Citation
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - citation__doi
    - citation__url
    - citation__accessed
    - citation__text
    - citation__used_for_linkage
    attributes:
      doi:
        name: doi
        description: 'Bare DOI, without the doi: prefix or resolver URL, e.g. 10.1234/abcd.'
        title: DOI
        pattern: ^10\.\d{4,9}/\S+$
      url:
        name: url
        description: Web address of the source or its documentation.
        title: URL
        range: uri
      accessed:
        name: accessed
        description: Date the URL was accessed. Required when url is given without
          a DOI.
        title: Accessed
        range: date
      text:
        name: text
        description: Free-text citation, for sources without a DOI or URL.
        title: Citation text
      used_for_linkage:
        name: used_for_linkage
        description: True if this is the source actually used for the linkage. Replaces
          the old "*" marker.
        title: Used for linkage
        range: boolean
    class_uri: expo:Citation
    any_of:
    - slot_conditions:
        doi:
          name: doi
          required: true
    - slot_conditions:
        url:
          name: url
          required: true
    - slot_conditions:
        text:
          name: text
          required: true
  GeographicCoverage:
    name: GeographicCoverage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/GeographicCoverage
    description: Area covered by a source dataset.
    title: Geographic coverage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - geographicCoverage__scope
    - geographicCoverage__regions
    - geographicCoverage__description
    attributes:
      scope:
        name: scope
        description: Kind of coverage.
        title: Scope
        range: GeographicScopeEnum
        required: true
      regions:
        name: regions
        description: ISO 3166-1 / ISO 3166-2 codes. Required when scope = COUNTRIES_OR_REGIONS.
        title: Regions
        range: RegionCode
        multivalued: true
      description:
        name: description
        description: Optional note, e.g. "UK-wide", "multiple provinces".
        title: Coverage description
    class_uri: expo:GeographicCoverage
    rules:
    - preconditions:
        slot_conditions:
          scope:
            name: scope
            equals_string: COUNTRIES_OR_REGIONS
      postconditions:
        slot_conditions:
          regions:
            name: regions
            required: true
      description: Country/region scope needs region codes.
  SpatialResolution:
    name: SpatialResolution
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/SpatialResolution
    description: Spatial resolution of a source dataset, as numbers rather than strings
      such as "100 m x 100 m".
    title: Spatial resolution
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - spatialResolution__type
    - spatialResolution__cell_width
    - spatialResolution__cell_height
    - spatialResolution__admin_unit_name
    - spatialResolution__admin_unit_approx_population
    attributes:
      type:
        name: type
        description: Kind of spatial support.
        title: Resolution type
        range: SpatialResolutionTypeEnum
        required: true
      cell_width:
        name: cell_width
        description: Grid cell width; metres for GRID_METRIC, degrees for GRID_DEGREE.
        title: Cell width
        range: float
      cell_height:
        name: cell_height
        description: Grid cell height; metres for GRID_METRIC, degrees for GRID_DEGREE.
        title: Cell height
        range: float
      admin_unit_name:
        name: admin_unit_name
        description: For ADMINISTRATIVE_UNIT, the unit type, e.g. LSOA, census tract.
        title: Administrative unit name
      admin_unit_approx_population:
        name: admin_unit_approx_population
        description: Typical population of one administrative unit.
        title: Administrative unit approximate population
        range: integer
    class_uri: expo:SpatialResolution
    rules:
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: GRID_METRIC
      postconditions:
        slot_conditions:
          cell_width:
            name: cell_width
            required: true
          cell_height:
            name: cell_height
            required: true
      description: Metric grid needs cell size.
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: GRID_DEGREE
      postconditions:
        slot_conditions:
          cell_width:
            name: cell_width
            required: true
          cell_height:
            name: cell_height
            required: true
      description: Degree grid needs cell size.
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: ADMINISTRATIVE_UNIT
      postconditions:
        slot_conditions:
          admin_unit_name:
            name: admin_unit_name
            required: true
      description: Admin unit needs a unit name.
  TemporalCoverage:
    name: TemporalCoverage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/TemporalCoverage
    description: Period covered by a source dataset.
    title: Temporal coverage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - temporalCoverage__start
    - temporalCoverage__end
    - temporalCoverage__ongoing
    - temporalCoverage__last_updated
    attributes:
      start:
        name: start
        description: First date covered, as an ISO 8601 partial date.
        title: Date Coverage - Start
        range: PartialDate
        required: true
      end:
        name: end
        description: Last date covered, as an ISO 8601 partial date. Omit when ongoing
          = true.
        title: Date Coverage - End
        range: PartialDate
      ongoing:
        name: ongoing
        description: True if the dataset is still being extended. Replaces the magic
          string "Ongoing".
        title: Ongoing
        range: boolean
      last_updated:
        name: last_updated
        description: Date of the most recent update. Required when ongoing = true.
        title: Last updated
        range: PartialDate
    class_uri: expo:TemporalCoverage
    rules:
    - preconditions:
        slot_conditions:
          ongoing:
            name: ongoing
            equals_string: 'true'
      postconditions:
        slot_conditions:
          last_updated:
            name: last_updated
            required: true
      description: Ongoing datasets need a last-updated date.
  ValidationMetric:
    name: ValidationMetric
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ValidationMetric
    description: One reported validation metric of a source dataset.
    title: Validation metric
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - validationMetric__metric
    - validationMetric__validation_design
    - validationMetric__value
    - validationMetric__unit
    attributes:
      metric:
        name: metric
        description: The validation statistic.
        title: Metric
        range: ValidationMetricEnum
        required: true
      validation_design:
        name: validation_design
        description: How the validation was carried out.
        title: Validation design
        range: ValidationDesignEnum
      value:
        name: value
        description: Value of the statistic.
        title: Value
        range: float
        required: true
      unit:
        name: unit
        description: UCUM code, for RMSE and mean bias. Omit for R2, r and percentages.
        title: Unit
        range: UcumCode
    class_uri: expo:ValidationMetric
  Uncertainty:
    name: Uncertainty
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Uncertainty
    description: Uncertainty information for a source dataset.
    title: Uncertainty
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - uncertainty__type
    - uncertainty__value
    - uncertainty__lower
    - uncertainty__upper
    - uncertainty__unit
    - uncertainty__carried_to_participant_level
    attributes:
      type:
        name: type
        description: Form in which uncertainty is available.
        title: Uncertainty type
        range: UncertaintyTypeEnum
        required: true
      value:
        name: value
        description: Point value of the uncertainty measure, if a single value applies.
        title: Value
        range: float
      lower:
        name: lower
        description: Lower bound of the uncertainty interval.
        title: Lower bound
        range: float
      upper:
        name: upper
        description: Upper bound of the uncertainty interval.
        title: Upper bound
        range: float
      unit:
        name: unit
        description: UCUM code for value, lower and upper.
        title: Unit
        range: UcumCode
      carried_to_participant_level:
        name: carried_to_participant_level
        description: True if uncertainty is propagated to the participant-level exposure
          values.
        title: Carried to participant level
        range: boolean
    class_uri: expo:Uncertainty
  Linkage:
    name: Linkage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Linkage
    description: How exposure values were assigned to participants.
    title: Linkage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - linkage__spatial_linkage_unit
    - linkage__centroid_weighting
    - linkage__centroid_areal_unit
    - linkage__population_dataset
    - linkage__operation
    - linkage__buffer_radii_m
    - linkage__network_mode
    - linkage__network_distance_m
    - linkage__network_time_min
    - linkage__intersection_min_overlap_pct
    - linkage__kernel_bandwidth_m
    - linkage__kernel_grid_resolution_m
    - linkage__geocoding_precision
    - linkage__geocoding_mixed_breakdown
    - linkage__geocoder
    - linkage__aggregation
    - linkage__aggregation_n
    - linkage__participant_coverage_pct
    - linkage__coverage_unit
    - linkage__study_area_coverage_pct
    - linkage__exposure_window
    - linkage__exposure_window_years
    - linkage__exposure_window_detail
    - linkage__residential_history
    - linkage__residential_history_detail
    - linkage__linkage_date
    - linkage__relinkages
    attributes:
      spatial_linkage_unit:
        name: spatial_linkage_unit
        description: Participant location used for the linkage.
        title: Spatial Linkage Unit
        range: SpatialLinkageUnitEnum
        required: true
      centroid_weighting:
        name: centroid_weighting
        description: How the centroid was computed. Required for any *_CENTROID unit.
        title: Centroid weighting
        range: CentroidWeightingEnum
      centroid_areal_unit:
        name: centroid_areal_unit
        description: The areal unit the centroid represents, e.g. "output area".
        title: Centroid areal unit
      population_dataset:
        name: population_dataset
        description: Population dataset used for POPULATION_WEIGHTED centroids.
        title: Population dataset
      operation:
        name: operation
        description: GIS operation used to assign values.
        title: Spatial Linkage Operation
        range: LinkageOperationEnum
        required: true
      buffer_radii_m:
        name: buffer_radii_m
        description: Buffer radii in metres. Required for CIRCULAR_BUFFER; list all
          radii if several were reported.
        title: Buffer Distance
        range: float
        multivalued: true
        minimum_value: 0
      network_mode:
        name: network_mode
        description: Travel mode for NETWORK_BUFFER.
        title: Network mode
        range: NetworkModeEnum
      network_distance_m:
        name: network_distance_m
        description: Network buffer distance in metres.
        title: Network distance (m)
        range: float
      network_time_min:
        name: network_time_min
        description: Network buffer travel time in minutes.
        title: Network time (min)
        range: float
      intersection_min_overlap_pct:
        name: intersection_min_overlap_pct
        description: Minimum areal overlap, in percent, for INTERSECTION.
        title: Intersection minimum overlap (%)
        range: float
        minimum_value: 0
        maximum_value: 100
      kernel_bandwidth_m:
        name: kernel_bandwidth_m
        description: Kernel bandwidth in metres. Required for KERNEL_DENSITY_WEIGHTED.
        title: Kernel bandwidth (m)
        range: float
      kernel_grid_resolution_m:
        name: kernel_grid_resolution_m
        description: Output grid resolution of the kernel density surface, in metres.
        title: Kernel grid resolution (m)
        range: float
      geocoding_precision:
        name: geocoding_precision
        description: Precision of participant geocodes.
        title: Geocoding Precision
        range: GeocodingPrecisionEnum
        recommended: true
      geocoding_mixed_breakdown:
        name: geocoding_mixed_breakdown
        description: For MIXED precision, the share of each level, e.g. "80% building,
          20% postcode".
        title: Geocoding mixed breakdown
      geocoder:
        name: geocoder
        description: Geocoding database name and version or release date.
        title: Geocoding Database Version
        recommended: true
      aggregation:
        name: aggregation
        description: Summary statistic applied to the exposure values. Buffer geometry
          is recorded once, under operation.
        title: Summary Statistic / Aggregation
        range: AggregationEnum
        required: true
      aggregation_n:
        name: aggregation_n
        description: N for MULTI_YEAR_MEAN (years) or PERCENTILE (the percentile).
        title: Aggregation N
        range: integer
      participant_coverage_pct:
        name: participant_coverage_pct
        description: Percentage (0-100) of coverage units that received an exposure
          value.
        title: Missing Data / Coverage
        range: float
        recommended: true
        minimum_value: 0
        maximum_value: 100
      coverage_unit:
        name: coverage_unit
        description: Unit that participant_coverage_pct counts.
        title: Coverage unit
        range: CoverageUnitEnum
      study_area_coverage_pct:
        name: study_area_coverage_pct
        description: Percentage (0-100) of the study area covered by the source dataset.
        title: Study area coverage (%)
        range: float
        minimum_value: 0
        maximum_value: 100
      exposure_window:
        name: exposure_window
        description: Period of exposure the linked values represent.
        title: Exposure Window
        range: ExposureWindowEnum
        recommended: true
      exposure_window_years:
        name: exposure_window_years
        description: Length of the exposure window in years, e.g. N for N_YEARS_BEFORE_INDEX.
        title: Exposure window (years)
        range: integer
      exposure_window_detail:
        name: exposure_window_detail
        description: Further detail, e.g. trimester or age range.
        title: Exposure window detail
      residential_history:
        name: residential_history
        description: Extent to which residential moves were accounted for.
        title: Residential History
        range: ResidentialHistoryEnum
        recommended: true
      residential_history_detail:
        name: residential_history_detail
        description: Free-text detail on how residential history was handled.
        title: Residential history detail
      linkage_date:
        name: linkage_date
        description: Date the linkage was performed.
        title: Linkage Date
        range: date
        recommended: true
      relinkages:
        name: relinkages
        description: Later re-runs of the linkage, e.g. after a geocoder update.
        title: Relinkages
        range: Relinkage
        multivalued: true
        inlined_as_list: true
    class_uri: expo:Linkage
    rules:
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: CIRCULAR_BUFFER
      postconditions:
        slot_conditions:
          buffer_radii_m:
            name: buffer_radii_m
            required: true
      description: Circular buffer needs a radius.
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: NETWORK_BUFFER
      postconditions:
        slot_conditions:
          network_mode:
            name: network_mode
            required: true
      description: Network buffer needs a mode.
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: KERNEL_DENSITY_WEIGHTED
      postconditions:
        slot_conditions:
          kernel_bandwidth_m:
            name: kernel_bandwidth_m
            required: true
      description: Kernel density needs bandwidth.
    - preconditions:
        slot_conditions:
          aggregation:
            name: aggregation
            equals_string: MULTI_YEAR_MEAN
      postconditions:
        slot_conditions:
          aggregation_n:
            name: aggregation_n
            required: true
      description: Multi-year mean needs N.
    - preconditions:
        slot_conditions:
          aggregation:
            name: aggregation
            equals_string: PERCENTILE
      postconditions:
        slot_conditions:
          aggregation_n:
            name: aggregation_n
            required: true
      description: Percentile needs N.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: POSTCODE_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: POSTCODE_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: CENSUS_TRACT_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: CENSUS_TRACT_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: LSOA_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: LSOA_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: MUNICIPALITY_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: MUNICIPALITY_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: OTHER_AREAL_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: OTHER_AREAL_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            equals_string: POPULATION_WEIGHTED
      postconditions:
        slot_conditions:
          population_dataset:
            name: population_dataset
            required: true
      description: Population weighting needs the population dataset.
    - preconditions:
        slot_conditions:
          geocoding_precision:
            name: geocoding_precision
