    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slot_uri: expo:records
    alias: records
    owner: ExposureLinkageCollection
    domain_of:
    - ExposureLinkageCollection
    range: ExposureLinkageRecord
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  exposureLinkageRecord__id:
    name: exposureLinkageRecord__id
    description: Stable record identifier, e.g. UKB-NO2-ELAPSE-2010.
    title: Record identifier
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slot_uri: expo:id
    identifier: true
    alias: id
    owner: ExposureLinkageRecord
    domain_of:
    - ExposureLinkageRecord
    range: string
    required: true
  exposureLinkageRecord__cohort:
    name: exposureLinkageRecord__cohort
    description: The cohort or study whose participants received the exposure values.
    title: Cohort
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slot_uri: expo:cohort
    alias: cohort
    owner: ExposureLinkageRecord
    domain_of:
    - ExposureLinkageRecord
    range: Cohort
    required: true
    inlined: true
    inlined_as_list: true
  exposureLinkageRecord__exposure:
    name: exposureLinkageRecord__exposure
    description: The exposure variable that was linked.
    title: Exposure
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slot_uri: expo:exposure
    alias: exposure
    owner: ExposureLinkageRecord
    domain_of:
    - ExposureLinkageRecord
    range: ExposureVariable
    required: true
    inlined: true
    inlined_as_list: true
  exposureLinkageRecord__source_data:
