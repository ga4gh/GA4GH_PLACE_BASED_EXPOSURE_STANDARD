classes:
  ExposureLinkageCollection:
    name: ExposureLinkageCollection
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureLinkageCollection
    description: Container so one file can hold many records.
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureLinkageCollection__records
    attributes:
      records:
        name: records
        range: ExposureLinkageRecord
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: expo:ExposureLinkageCollection
    tree_root: true
  ExposureLinkageRecord:
    name: ExposureLinkageRecord
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureLinkageRecord
    description: One exposure variable linked to one cohort.
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureLinkageRecord__id
    - exposureLinkageRecord__cohort
    - exposureLinkageRecord__exposure
    - exposureLinkageRecord__source_data
    - exposureLinkageRecord__linkage
    - exposureLinkageRecord__creators
    attributes:
      id:
        name: id
        description: Stable record identifier, e.g. UKB-NO2-ELAPSE-2010.
        identifier: true
      cohort:
        name: cohort
        range: Cohort
        required: true
        inlined: true
      exposure:
        name: exposure
        range: ExposureVariable
        required: true
        inlined: true
      source_data:
        name: source_data
        range: SourceDataset
        required: true
        inlined: true
      linkage:
        name: linkage
        range: Linkage
        required: true
        inlined: true
      creators:
        name: creators
        range: Person
        recommended: true
        multivalued: true
        inlined_as_list: true
    class_uri: expo:ExposureLinkageRecord
  Cohort:
    name: Cohort
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Cohort
    description: 'CSV: Cohort / Study Name; Country of Participant Data Collection'
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - cohort__name
    - cohort__acronym
    - cohort__collection_countries
    attributes:
      name:
        name: name
        description: Full name, e.g. UK Biobank.
        required: true
      acronym:
        name: acronym
        description: e.g. UKB. Split out of the old "Name (ACRONYM)" string.
        required: true
      collection_countries:
        name: collection_countries
        range: CountryCodeEnum
        required: true
        multivalued: true
    class_uri: expo:Cohort
  ExposureVariable:
    name: ExposureVariable
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ExposureVariable
    description: 'CSV: Exposure Domain; Exposure Variable Name; Ontology Term ID;
      Unit'
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - exposureVariable__domain
    - exposureVariable__domain_other
    - exposureVariable__name
    - exposureVariable__ontology_terms
    - exposureVariable__unit
    - exposureVariable__is_categorical
    attributes:
      domain:
        name: domain
        range: ExposureDomainEnum
        required: true
      domain_other:
        name: domain_other
        description: Required when domain = OTHER.
      name:
        name: name
        description: Descriptive term, e.g. NO2, PM2.5, Lden, NDVI.
        required: true
      ontology_terms:
        name: ontology_terms
        description: 'Chemicals: INCHIKEY (preferred), PUBCHEM, DTXSID, CAS. Physical/environmental:
          ExO, ENVO, MESH. Leave empty if none exists.'
        range: CURIE
        recommended: true
        multivalued: true
      unit:
        name: unit
        description: Omit for categorical variables.
        range: UcumCode
      is_categorical:
        name: is_categorical
        range: boolean
    class_uri: expo:ExposureVariable
    rules:
    - preconditions:
        slot_conditions:
          domain:
            name: domain
            equals_string: OTHER
      postconditions:
        slot_conditions:
          domain_other:
            name: domain_other
            required: true
      description: OTHER domain must be specified.
  SourceDataset:
    name: SourceDataset
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/SourceDataset
    description: The upstream exposure product (model, satellite, monitors...).
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - sourceDataset__origin
    - sourceDataset__dataset_name
    - sourceDataset__dataset_version
    - sourceDataset__citations
    - sourceDataset__geographic_coverage
    - sourceDataset__spatial_resolution
    - sourceDataset__temporal_coverage
    - sourceDataset__temporal_resolution
    - sourceDataset__update_frequency
    - sourceDataset__validation_metrics
    - sourceDataset__validation_reported
    - sourceDataset__uncertainty
    attributes:
      origin:
        name: origin
        range: DataOriginEnum
        required: true
      dataset_name:
        name: dataset_name
        description: e.g. ELAPSE LUR, ERA5, MODIS MOD13A3.
        required: true
      dataset_version:
        name: dataset_version
        description: Version number or release year, e.g. 2.0, 006, 2023.
        required: true
      citations:
        name: citations
        range: Citation
        required: true
        multivalued: true
        inlined_as_list: true
      geographic_coverage:
        name: geographic_coverage
        range: GeographicCoverage
        required: true
        inlined: true
      spatial_resolution:
        name: spatial_resolution
        range: SpatialResolution
        required: true
        inlined: true
      temporal_coverage:
        name: temporal_coverage
        range: TemporalCoverage
        required: true
        inlined: true
      temporal_resolution:
        name: temporal_resolution
        range: TemporalResolutionEnum
        required: true
      update_frequency:
        name: update_frequency
        description: For PERIODIC_UPDATE, e.g. P5Y (ISO 8601 duration).
        pattern: ^P(\d+Y)?(\d+M)?(\d+W)?(\d+D)?$
      validation_metrics:
        name: validation_metrics
        description: Empty list + validation_reported=false means not validated.
        range: ValidationMetric
        recommended: true
        multivalued: true
        inlined_as_list: true
      validation_reported:
        name: validation_reported
        range: boolean
      uncertainty:
        name: uncertainty
        range: Uncertainty
        recommended: true
        inlined: true
    class_uri: expo:SourceDataset
    rules:
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: PERIODIC_UPDATE
      postconditions:
        slot_conditions:
          update_frequency:
            name: update_frequency
            required: true
      description: Periodic update needs a frequency.
  Citation:
    name: Citation
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Citation
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - citation__doi
    - citation__url
    - citation__accessed
    - citation__text
    - citation__used_for_linkage
    attributes:
      doi:
        name: doi
        description: 'Bare DOI, without the doi: prefix.'
        pattern: ^10\.\d{4,9}/\S+$
      url:
        name: url
        range: uri
      accessed:
        name: accessed
        description: Required when url is given without a DOI.
        range: date
      text:
        name: text
        description: Free-text citation if no DOI/URL.
      used_for_linkage:
        name: used_for_linkage
        description: Replaces the old "*" marker.
        range: boolean
    class_uri: expo:Citation
    any_of:
    - slot_conditions:
        doi:
          name: doi
          required: true
    - slot_conditions:
        url:
          name: url
          required: true
    - slot_conditions:
        text:
          name: text
          required: true
  GeographicCoverage:
    name: GeographicCoverage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/GeographicCoverage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - geographicCoverage__scope
    - geographicCoverage__regions
    - geographicCoverage__description
    attributes:
      scope:
        name: scope
        range: GeographicScopeEnum
        required: true
      regions:
        name: regions
        description: Required when scope = COUNTRIES_OR_REGIONS.
        range: RegionCode
        multivalued: true
      description:
        name: description
        description: Optional note, e.g. "UK-wide", "multiple provinces".
    class_uri: expo:GeographicCoverage
    rules:
    - preconditions:
        slot_conditions:
          scope:
            name: scope
            equals_string: COUNTRIES_OR_REGIONS
      postconditions:
        slot_conditions:
          regions:
            name: regions
            required: true
      description: Country/region scope needs region codes.
  SpatialResolution:
    name: SpatialResolution
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/SpatialResolution
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - spatialResolution__type
    - spatialResolution__cell_width
    - spatialResolution__cell_height
    - spatialResolution__admin_unit_name
    - spatialResolution__admin_unit_approx_population
    attributes:
      type:
        name: type
        range: SpatialResolutionTypeEnum
        required: true
      cell_width:
        name: cell_width
        description: For GRID_METRIC (metres) or GRID_DEGREE (degrees).
        range: float
      cell_height:
        name: cell_height
        range: float
      admin_unit_name:
        name: admin_unit_name
        description: For ADMINISTRATIVE_UNIT, e.g. LSOA, census tract.
      admin_unit_approx_population:
        name: admin_unit_approx_population
        range: integer
    class_uri: expo:SpatialResolution
    rules:
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: GRID_METRIC
      postconditions:
        slot_conditions:
          cell_width:
            name: cell_width
            required: true
          cell_height:
            name: cell_height
            required: true
      description: Metric grid needs cell size.
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: GRID_DEGREE
      postconditions:
        slot_conditions:
          cell_width:
            name: cell_width
            required: true
          cell_height:
            name: cell_height
            required: true
      description: Degree grid needs cell size.
    - preconditions:
        slot_conditions:
          type:
            name: type
            equals_string: ADMINISTRATIVE_UNIT
      postconditions:
        slot_conditions:
