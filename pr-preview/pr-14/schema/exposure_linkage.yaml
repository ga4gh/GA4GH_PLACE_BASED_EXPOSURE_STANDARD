  TemporalCoverage:
    name: TemporalCoverage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/TemporalCoverage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - temporalCoverage__start
    - temporalCoverage__end
    - temporalCoverage__ongoing
    - temporalCoverage__last_updated
    attributes:
      start:
        name: start
        range: PartialDate
        required: true
      end:
        name: end
        description: Omit when ongoing = true.
        range: PartialDate
      ongoing:
        name: ongoing
        range: boolean
      last_updated:
        name: last_updated
        description: Required when ongoing = true.
        range: PartialDate
    class_uri: expo:TemporalCoverage
    rules:
    - preconditions:
        slot_conditions:
          ongoing:
            name: ongoing
            equals_string: 'true'
      postconditions:
        slot_conditions:
          last_updated:
            name: last_updated
            required: true
      description: Ongoing datasets need a last-updated date.
  ValidationMetric:
    name: ValidationMetric
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/ValidationMetric
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - validationMetric__metric
    - validationMetric__validation_design
    - validationMetric__value
    - validationMetric__unit
    attributes:
      metric:
        name: metric
        range: ValidationMetricEnum
        required: true
      validation_design:
        name: validation_design
        range: ValidationDesignEnum
      value:
        name: value
        range: float
        required: true
      unit:
        name: unit
        description: For RMSE / mean bias; omit for R2, r, %.
        range: UcumCode
    class_uri: expo:ValidationMetric
  Uncertainty:
    name: Uncertainty
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Uncertainty
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - uncertainty__type
    - uncertainty__value
    - uncertainty__lower
    - uncertainty__upper
    - uncertainty__unit
    - uncertainty__carried_to_participant_level
    attributes:
      type:
        name: type
        range: UncertaintyTypeEnum
        required: true
      value:
        name: value
        range: float
      lower:
        name: lower
        range: float
      upper:
        name: upper
        range: float
      unit:
        name: unit
        range: UcumCode
      carried_to_participant_level:
        name: carried_to_participant_level
        range: boolean
    class_uri: expo:Uncertainty
  Linkage:
    name: Linkage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Linkage
    description: How exposure values were assigned to participants.
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - linkage__spatial_linkage_unit
    - linkage__centroid_weighting
    - linkage__centroid_areal_unit
    - linkage__population_dataset
    - linkage__operation
    - linkage__buffer_radii_m
    - linkage__network_mode
    - linkage__network_distance_m
    - linkage__network_time_min
    - linkage__intersection_min_overlap_pct
    - linkage__kernel_bandwidth_m
    - linkage__kernel_grid_resolution_m
    - linkage__geocoding_precision
    - linkage__geocoding_mixed_breakdown
    - linkage__geocoder
    - linkage__aggregation
    - linkage__aggregation_n
    - linkage__participant_coverage_pct
    - linkage__coverage_unit
    - linkage__study_area_coverage_pct
    - linkage__exposure_window
    - linkage__exposure_window_years
    - linkage__exposure_window_detail
    - linkage__residential_history
    - linkage__residential_history_detail
    - linkage__linkage_date
    - linkage__relinkages
    attributes:
      spatial_linkage_unit:
        name: spatial_linkage_unit
        range: SpatialLinkageUnitEnum
        required: true
      centroid_weighting:
        name: centroid_weighting
        description: Required for any *_CENTROID unit.
        range: CentroidWeightingEnum
      centroid_areal_unit:
        name: centroid_areal_unit
      population_dataset:
        name: population_dataset
        description: For population-weighted centroids.
      operation:
        name: operation
        range: LinkageOperationEnum
        required: true
      buffer_radii_m:
        name: buffer_radii_m
        description: Required for CIRCULAR_BUFFER; list all if several reported.
        range: float
        multivalued: true
        minimum_value: 0
      network_mode:
        name: network_mode
        range: NetworkModeEnum
      network_distance_m:
        name: network_distance_m
        range: float
      network_time_min:
        name: network_time_min
        range: float
      intersection_min_overlap_pct:
        name: intersection_min_overlap_pct
        range: float
        minimum_value: 0
        maximum_value: 100
      kernel_bandwidth_m:
        name: kernel_bandwidth_m
        range: float
      kernel_grid_resolution_m:
        name: kernel_grid_resolution_m
        range: float
      geocoding_precision:
        name: geocoding_precision
        range: GeocodingPrecisionEnum
        recommended: true
      geocoding_mixed_breakdown:
        name: geocoding_mixed_breakdown
        description: For MIXED, e.g. "80% building, 20% postcode".
      geocoder:
        name: geocoder
        description: Geocoding database name and version/release date.
        recommended: true
      aggregation:
        name: aggregation
        range: AggregationEnum
        required: true
      aggregation_n:
        name: aggregation_n
        description: N for MULTI_YEAR_MEAN (years) or PERCENTILE.
        range: integer
      participant_coverage_pct:
        name: participant_coverage_pct
        range: float
        recommended: true
        minimum_value: 0
        maximum_value: 100
      coverage_unit:
        name: coverage_unit
        range: CoverageUnitEnum
      study_area_coverage_pct:
        name: study_area_coverage_pct
        range: float
        minimum_value: 0
        maximum_value: 100
      exposure_window:
        name: exposure_window
        range: ExposureWindowEnum
        recommended: true
      exposure_window_years:
        name: exposure_window_years
        range: integer
      exposure_window_detail:
        name: exposure_window_detail
        description: Trimester, age range, etc.
      residential_history:
        name: residential_history
        range: ResidentialHistoryEnum
        recommended: true
      residential_history_detail:
        name: residential_history_detail
      linkage_date:
        name: linkage_date
        range: date
        recommended: true
      relinkages:
        name: relinkages
        range: Relinkage
        multivalued: true
        inlined_as_list: true
    class_uri: expo:Linkage
    rules:
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: CIRCULAR_BUFFER
      postconditions:
        slot_conditions:
          buffer_radii_m:
            name: buffer_radii_m
            required: true
      description: Circular buffer needs a radius.
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: NETWORK_BUFFER
      postconditions:
        slot_conditions:
          network_mode:
            name: network_mode
            required: true
      description: Network buffer needs a mode.
    - preconditions:
        slot_conditions:
          operation:
            name: operation
            equals_string: KERNEL_DENSITY_WEIGHTED
      postconditions:
        slot_conditions:
          kernel_bandwidth_m:
            name: kernel_bandwidth_m
            required: true
      description: Kernel density needs bandwidth.
    - preconditions:
        slot_conditions:
          aggregation:
            name: aggregation
            equals_string: MULTI_YEAR_MEAN
      postconditions:
        slot_conditions:
          aggregation_n:
            name: aggregation_n
            required: true
      description: Multi-year mean needs N.
    - preconditions:
        slot_conditions:
          aggregation:
            name: aggregation
            equals_string: PERCENTILE
      postconditions:
        slot_conditions:
          aggregation_n:
            name: aggregation_n
            required: true
      description: Percentile needs N.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: POSTCODE_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: POSTCODE_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: CENSUS_TRACT_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: CENSUS_TRACT_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: LSOA_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: LSOA_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: MUNICIPALITY_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: MUNICIPALITY_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          spatial_linkage_unit:
            name: spatial_linkage_unit
            equals_string: OTHER_AREAL_CENTROID
      postconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            required: true
      description: OTHER_AREAL_CENTROID needs centroid weighting.
    - preconditions:
        slot_conditions:
          centroid_weighting:
            name: centroid_weighting
            equals_string: POPULATION_WEIGHTED
      postconditions:
        slot_conditions:
          population_dataset:
            name: population_dataset
            required: true
      description: Population weighting needs the population dataset.
    - preconditions:
        slot_conditions:
          geocoding_precision:
            name: geocoding_precision
            equals_string: MIXED
      postconditions:
        slot_conditions:
          geocoding_mixed_breakdown:
            name: geocoding_mixed_breakdown
            required: true
      description: Mixed geocoding needs a breakdown.
  Relinkage:
    name: Relinkage
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Relinkage
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - relinkage__date
    - relinkage__reason
    attributes:
      date:
        name: date
        range: date
        required: true
      reason:
        name: reason
        required: true
    class_uri: expo:Relinkage
  Person:
    name: Person
    definition_uri: https://w3id.org/ga4gh/exposure-linkage/Person
    description: 'CSV: Creator(s)'
    from_schema: https://w3id.org/ga4gh/exposure-linkage
    slots:
    - person__name
    - person__email
    - person__orcid
    - person__role
    attributes:
      name:
        name: name
      email:
        name: email
        pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      orcid:
        name: orcid
        description: e.g. ORCID:0000-0002-1825-0097
        range: CURIE
      role:
        name: role
        description: e.g. senior investigator
    class_uri: expo:Person
