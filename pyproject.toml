[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "exposure_linkage"
description = "GA4GH Place-Based Exposure Metadata Standard: a LinkML schema describing how environmental exposure datasets are linked to cohort participants."
authors = [
  {name = "GA4GH Human Exposome Data Standards Study Group", email = "TODO-contact@example.org"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/exposure_linkage/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/exposure_linkage/datamodel/exposure_linkage_pydantic.py",
  "src/exposure_linkage/datamodel/exposure_linkage.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
# fo: ISO 3166-1 code for the Faroe Islands
ignore-words-list = "linke,fo"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
# ISO 3166-1 country codes
BA = "BA"
FO = "FO"
PN = "PN"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/exposure_linkage/datamodel/exposure_linkage_pydantic.py",
  "src/exposure_linkage/datamodel/exposure_linkage.py",
]
